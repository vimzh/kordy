services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kyub
      POSTGRES_USER: kyub
      POSTGRES_PASSWORD: kyub
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - kyub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyub -d kyub"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  kyub-postgres:
